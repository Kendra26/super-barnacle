name: Torrent Download & Upload to Filemirage

on:
  push:
    branches:
      - Mirage
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '8ec6f000-e8d1-403d-820b-4324a6a68869'  # Keep for reference if needed
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'  # Your Filemirage API token
      FOLDER_PATH: 'downloaded_files'  # Folder to store downloads
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          # Replaced aria2 with transmission-cli
          sudo apt update && sudo apt install transmission-cli jq curl -y
          # Download links (replace with your actual method for links)
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with transmission-cli
        run: |
          mkdir -p $FOLDER_PATH
          
          # Create a script to kill transmission-cli once the download finishes (prevents seeding)
          echo "killall transmission-cli" > stop_seed.sh
          chmod +x stop_seed.sh
          
          # Loop through each link in page.txt
          while IFS= read -r link; do
            # Strip carriage returns in case the downloaded text file has Windows line endings
            link=$(echo "$link" | tr -d '\r')
            
            # Skip empty lines and commented lines
            if [ -n "$link" ] && [[ ! "$link" =~ ^# ]]; then
              echo "Downloading: $link"
              # -w sets the download directory
              # -f executes our script when download completes, terminating the transmission-cli process
              transmission-cli -w "$FOLDER_PATH" -f ./stop_seed.sh "$link" || true
            fi
          done < page.txt

      - name: Upload files to Filemirage
        run: |
          # Set variables
          SERVER=$(curl -s https://filemirage.com/api/servers | jq -r '.data.server')
          UPLOAD_ID=$(curl -s https://filemirage.com/api/servers | jq -r '.data.upload_id')
          
          echo "Using server: $SERVER"
          echo "Upload ID: $UPLOAD_ID"
          
          # Recursively find and upload files
          find "$FOLDER_PATH" -type f | while read -r FILE; do
              FILENAME=$(basename "$FILE")
              echo "Uploading: $FILE"
              
              RESPONSE=$(curl -s -H "Authorization: Bearer 9QQH-DGES-CWQZ-FXNV" \
                -F "file=@$FILE;filename=$FILENAME" \
                "$SERVER/upload.php")
              
              success=$(echo "$RESPONSE" | jq -r '.success')
              if [ "$success" != "true" ]; then
                  echo "Failed to upload $FILENAME: $(echo "$RESPONSE" | jq -r '.message')"
              else
                  echo "Successfully uploaded: $FILENAME"
              fi
          done
