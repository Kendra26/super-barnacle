name: Torrent Download & Upload to Filemirage

on:
  push:
    branches:
      - Mirage
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '9'  # Keep for reference if needed
      FILEMIRAGE_API_TOKEN: ''  # Your Filemirage API token
      FOLDER_PATH: 'downloaded_files'  # Folder to store downloads
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          # Added transmission-daemon alongside transmission-cli
          sudo apt update && sudo apt install transmission-daemon transmission-cli jq curl -y
          # Download links
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with Transmission
        run: |
          mkdir -p "$FOLDER_PATH"
          
          # Start the transmission background daemon with auth disabled (-T) 
          # and set the download folder to our target directory
          transmission-daemon -T -w "$PWD/$FOLDER_PATH"
          
          # Give the daemon a few seconds to fully initialize
          sleep 3
          
          # Loop through each link and add it to the daemon
          while IFS= read -r link || [ -n "$link" ]; do
            link=$(echo "$link" | tr -d '\r')
            if [ -n "$link" ] && [[ ! "$link" =~ ^# ]]; then
              echo "Adding to Transmission: $link"
              # -a adds the torrent to the active daemon
              transmission-remote -a "$link"
            fi
          done < page.txt
          
          echo "Waiting for all torrents to finish downloading..."
          
          # Monitoring loop
          while true; do
            sleep 10
            
            # Print current status to the GitHub Actions log so you can see progress
            transmission-remote -l
            
            # Extract the raw list of torrents (stripping the header and summary footer)
            TORRENT_LIST=$(transmission-remote -l | sed '1d;$d')
            
            # If the list is empty (e.g. invalid links), break to avoid infinite loop
            if [ -z "$(echo "$TORRENT_LIST" | tr -d ' \n\r')" ]; then
              echo "No active torrents found."
              break
            fi
            
            # Count the total torrents vs the torrents that contain "100%"
            TOTAL=$(echo "$TORRENT_LIST" | wc -l)
            COMPLETED=$(echo "$TORRENT_LIST" | grep -c "100%" || true)
            
            echo "--> Progress: $COMPLETED of $TOTAL torrents finished."
            
            if [ "$COMPLETED" -eq "$TOTAL" ]; then
              echo "All downloads reached 100%!"
              break
            fi
          done
          
          # Stop the daemon to halt all seeding
          echo "Killing Transmission daemon to stop seeding..."
          killall transmission-daemon
          sleep 2

      - name: Upload files to Filemirage
        run: |
          # Set variables
          SERVER=$(curl -s https://filemirage.com/api/servers | jq -r '.data.server')
          UPLOAD_ID=$(curl -s https://filemirage.com/api/servers | jq -r '.data.upload_id')
          
          echo "Using server: $SERVER"
          echo "Upload ID: $UPLOAD_ID"
          
          # Recursively find and upload files
          find "$FOLDER_PATH" -type f | while read -r FILE; do
              FILENAME=$(basename "$FILE")
              echo "Uploading: $FILE"
              
              RESPONSE=$(curl -s -H "Authorization: Bearer 9QQH-DGES-CWQZ-FXNV" \
                -F "file=@$FILE;filename=$FILENAME" \
                "$SERVER/upload.php")
              
              success=$(echo "$RESPONSE" | jq -r '.success')
              if [ "$success" != "true" ]; then
                  echo "Failed to upload $FILENAME: $(echo "$RESPONSE" | jq -r '.message')"
              else
                  echo "Successfully uploaded: $FILENAME"
              fi
          done
